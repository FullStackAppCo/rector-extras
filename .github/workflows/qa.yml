name: QA

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  qa:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Refactor (Rector dry run)
        run: vendor/bin/rector process --dry-run

      - name: Format (Pint test mode)
        run: vendor/bin/pint --test

      - name: Analyze (PHPStan)
        run: composer analyze

      - name: Autoload (strict PSR-4)
        run: composer dump-autoload --strict-psr --optimize --dry-run

      - name: Test (PHPUnit)
        run: composer test
